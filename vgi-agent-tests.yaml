# Private graders for `vgi-lint simulate` (VGI920). The worker publishes only task names
# and prompts in vgi.agent_test_tasks (vgi_adbc/metadata.py); the canonical solutions stay
# here, never in the catalog metadata. Graded against the deterministic SQLite fixture
# built by test/make_fixture.py (attach it with driver=sqlite, uri=<fixture>).
tasks:
  - name: source_views
    reference_sql: "SELECT name AS relation_name FROM adbc.main.adbc_query('SELECT name FROM sqlite_master WHERE type = ''view''') ORDER BY relation_name"

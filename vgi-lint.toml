[tool.vgi-lint-check]
select = ["ALL"]
fail_on = "info"

# This worker is a *passthrough connector*: its schemas, tables, views, and columns
# are discovered live from whatever remote database a user ATTACHes — they are not
# authored here and differ per attachment. So the per-table / per-column / per-
# constraint documentation and example rules cannot apply (there is nothing static
# to document). The connector *itself* — the catalog and its schema — is documented
# richly (see vgi_adbc/metadata.py); those rules stay enforced. The exemptions below
# are the remote-object rules only.
ignore = [
    { code = "VGI307", kind = "domain-exemption", reason = "adbc_query returns a runtime-determined schema (whatever the passthrough SQL yields) — there is no fixed result schema to declare" },
    { code = "VGI151", kind = "domain-exemption", reason = "min examples counts examples on advertised tables/functions; ours live on the catalog/schema and the internal scan function (tables are dynamic)" },
    { code = "VGI515", kind = "tooling-bug", reason = "tooling drift: our adbc_query examples DO carry descriptions (verified on the advertised FunctionInfo via _function_to_info), but the current vgi-lint-check reports them as missing — a lint/serialization artifact, not a metadata defect" },

    { code = "VGI111", kind = "domain-exemption", reason = "table has no comment — remote tables are the user's, discovered live" },
    { code = "VGI112", kind = "domain-exemption", reason = "table missing vgi.doc_llm — idem" },
    { code = "VGI113", kind = "domain-exemption", reason = "table missing vgi.doc_md — idem" },
    { code = "VGI123", kind = "domain-exemption", reason = "object needs a classifying tag — enforced on our schema; remote tables can't carry one" },
    { code = "VGI126", kind = "domain-exemption", reason = "object needs vgi.keywords — enforced on catalog/schema; not on remote tables" },
    { code = "VGI201", kind = "domain-exemption", reason = "column comment coverage — remote columns are the user's" },
    { code = "VGI202", kind = "domain-exemption", reason = "column has no comment — idem" },
    { code = "VGI411", kind = "domain-exemption", reason = "each object should carry a vgi.category — remote tables can't be tagged" },
    { code = "VGI412", kind = "domain-exemption", reason = "a declared category must contain a member — every category would be empty (dynamic tables)" },
    { code = "VGI413", kind = "domain-exemption", reason = "schema must declare a vgi.categories registry — pointless when no object can join a category" },
    { code = "VGI501", kind = "domain-exemption", reason = "tables should ship vgi.example_queries — remote tables are dynamic" },
    { code = "VGI511", kind = "domain-exemption", reason = "every object called by an example — cannot pre-name a user's tables" },
    { code = "VGI520", kind = "domain-exemption", reason = "every object exercised by an agent test task — cannot pre-name a user's tables" },
    { code = "VGI806", kind = "domain-exemption", reason = "no constraints declared on any table — remote schema owns constraints" },
    { code = "VGI807", kind = "domain-exemption", reason = "each table should declare a primary key — idem" },
]


[tool.vgi-lint-check.execution]
# The scan probes attach a live SQLite fixture over ADBC; give the worker room to
# install/load adbc_scanner on first use. CI runs the gate with --no-execute.
scan_timeout = 120
timeout = 120
concurrency = 1
